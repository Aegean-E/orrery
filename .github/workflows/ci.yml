name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v

      - name: Compile sources
        run: python -m compileall -q orrery tests

      - name: Install package
        run: python -m pip install .

      - name: Console script smoke test
        run: orrery --version

      - name: Launcher smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: "echo.|run.cmd solar --frames 1 --width 40 --height 12 --ascii --no-color"

      - name: Launcher smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x run.sh
          test -x run.command
          sh run.sh solar --frames 1 --width 40 --height 12 --ascii --no-color
          printf '\n' | sh run.command solar --frames 1 --width 40 --height 12 --ascii --no-color

      - name: Static lint
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: |
          python -m pip install ruff
          ruff check .

      - name: Build wheel and sdist
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: |
          python -m pip install build
          python -m build
